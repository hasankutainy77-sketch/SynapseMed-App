name: Generate SynapseMed Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore synapsemed-release.jks \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=SynapseMed, OU=Mobile, O=SynapseMed, L=Aleppo, ST=Aleppo, C=SY"

      - name: Encode Keystore
        run: |
          base64 -w 0 synapsemed-release.jks > synapsemed-keystore-base64.txt

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: SynapseMed-Keystore
          path: synapsemed-keystore-base64.txt
          retention-days: 1
