name: Build SynapseMed APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare icon source
        run: |
          set -e

          if [ ! -f "assets/icon-only.png" ]; then
            echo "ERROR: assets/icon-only.png not found"
            exit 1
          fi

          mkdir -p assets

          cp assets/icon-only.png assets/icon.png

          echo "Icon source prepared:"
          ls -lh assets/icon.png

      - name: Generate Android launcher icons
        run: |
          npx --yes @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#063A78' \
            --iconBackgroundColorDark '#063A78'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify generated icon resources
        run: |
          set -e

          RES="android/app/src/main/res"

          echo "===== GENERATED ICON FILES ====="
          find "$RES" -type f | grep -E 'ic_launcher|launcher' || true

          echo "===== ADAPTIVE ICON FILES ====="
          find "$RES" -type f -name "*.xml" | grep -E 'mipmap|launcher' || true

          if [ ! -d "$RES/mipmap-anydpi-v26" ]; then
            echo "WARNING: Adaptive icon directory not found"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK launcher icon
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found"
            exit 1
          fi

          echo "===== APK APPLICATION ====="
          "$AAPT" dump badging "$APK" | grep -E "application:|application-icon"

          echo "===== APK ICON RESOURCES ====="
          unzip -l "$APK" | grep -E "ic_launcher|mipmap" || true

          echo "===== MANIFEST ICON ====="
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -A 5 -B 3 "icon"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SynapseMed-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
