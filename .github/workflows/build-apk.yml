name: Build SynapseMed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          mkdir -p assets
          cp assets/icon-only.png assets/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#063A78' --iconBackgroundColorDark '#063A78'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android Back Button
        run: |
          mkdir -p android/app/src/main/java/com/synapsemed/app

          cat > android/app/src/main/java/com/synapsemed/app/MainActivity.java <<'EOF'
          package com.synapsemed.app;

          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onBackPressed() {
                  if (bridge == null || bridge.getWebView() == null) {
                      super.onBackPressed();
                      return;
                  }

                  WebView webView = bridge.getWebView();
                  String currentUrl = webView.getUrl();

                  if (currentUrl == null) {
                      super.onBackPressed();
                      return;
                  }

                  if (!currentUrl.contains("/index.html")
                      && !currentUrl.endsWith("localhost/")
                      && !currentUrl.endsWith("localhost")) {
                      webView.post(() ->
                          webView.loadUrl("https://localhost/index.html")
                      );
                      return;
                  }

                  webView.evaluateJavascript(
                      "window.handleAndroidBack ? window.handleAndroidBack() : 'exit'",
                      result -> {
                          if (!"\"handled\"".equals(result)) {
                              MainActivity.super.onBackPressed();
                          }
                      }
                  );
              }
          }
          EOF

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/synapsemed-release.jks

          test -s android/app/synapsemed-release.jks

      - name: Configure Release Signing
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Signing secrets are missing"
            exit 1
          fi

          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("synapsemed-release.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build APKs
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease

      - name: Verify Release APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Release APK not found!"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "Signed Release APK verified successfully"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SynapseMed-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SynapseMed-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
