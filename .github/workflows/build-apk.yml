name: Build SynapseMed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          mkdir -p assets
          cp assets/icon-only.png assets/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#063A78' --iconBackgroundColorDark '#063A78'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android Back Button
        run: |
          mkdir -p android/app/src/main/java/com/synapsemed/app

          cat > android/app/src/main/java/com/synapsemed/app/MainActivity.java <<'EOF'
          package com.synapsemed.app;

          import android.webkit.WebView;
          import android.os.Handler;
          import android.os.Looper;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private boolean backPressedOnce = false;

              @Override
              public void onBackPressed() {

                  if (bridge == null || bridge.getWebView() == null) {
                      super.onBackPressed();
                      return;
                  }

                  WebView webView = bridge.getWebView();

                  String currentUrl = webView.getUrl();

                  if (currentUrl == null) {
                      super.onBackPressed();
                      return;
                  }

                  // إذا كان المستخدم داخل محاكي مستقل
                  // نعيده إلى الصفحة الرئيسية للتطبيق.
                  if (!currentUrl.contains("/index.html")
                      && !currentUrl.endsWith("localhost/")
                      && !currentUrl.endsWith("localhost")) {

                      webView.post(() -> {
                          webView.loadUrl("https://localhost/index.html");
                      });

                      return;
                  }

                  // داخل الصفحة الرئيسية:
                  // استدعاء دالة الرجوع الموجودة في index.html
                  webView.evaluateJavascript(
                      "window.handleAndroidBack ? window.handleAndroidBack() : 'exit'",
                      result -> {

                          if ("\"handled\"".equals(result)) {
                              return;
                          }

                          // إذا كان المستخدم على الصفحة الرئيسية
                          // نسمح بإغلاق التطبيق.
                          super.onBackPressed();
                      }
                  );
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          echo "APK successfully built"

          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging "$APK" | head -20
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SynapseMed-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
