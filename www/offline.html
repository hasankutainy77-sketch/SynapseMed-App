<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f1c">
  <title>SynapseMed | انقطاع الاتصال</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: #080f1c;
  color: #f1f6fb;
  font-family: system-ui, sans-serif;
  text-align: center;
}

.card {
  width: min(100%, 420px);
  padding: 38px 25px;
  border-radius: 26px;
  background: linear-gradient(145deg, #142238, #101b2c);
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 20px 70px rgba(0,0,0,.3);
}

.icon {
  width: 90px;
  height: 90px;
  display: grid;
  place-items: center;
  margin: 0 auto 24px;
  border-radius: 28px;
  background: rgba(36,214,193,.1);
  color: #24d6c1;
  font-size: 42px;
}

h1 {
  font-size: 25px;
  margin-bottom: 12px;
}

p {
  color: #8da1b8;
  font-size: 14px;
  line-height: 2;
  margin-bottom: 25px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #24d6c1;
  color: #071b20;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.brand {
  margin-top: 25px;
  color: #24d6c1;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
}

  </style>
</head>
<body>
  <main class="card">
    <div class="icon">⌁</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>
      يبدو أن اتصالك بالإنترنت غير متاح حالياً.
      تحقق من اتصالك، ثم حاول مجدداً للوصول إلى المحاكاة.
    </p>
    <button onclick="retryConnection()">إعادة المحاولة</button>
    <div class="brand">SYNAPSEMED</div>
  </main>  <script>
    function retryConnection() {
      if (!navigator.onLine) {
        alert("ما زال الاتصال بالإنترنت غير متاح.");
        return;
      }

      window.location.href = "index.html";
    }

    window.addEventListener("online", () => {
      window.location.href = "index.html";
    });
  </script></body>
</html>
