<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080f1c">
<title>SynapseMed | Simulation</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#080f1c;color:#f1f6fb;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
.viewer-header{
  min-height:54px;padding:9px 14px;background:#101b2c;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:space-between;gap:12px
}
.viewer-title{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-home{
  border:0;border-radius:9px;padding:9px 14px;
  background:#24d6c1;color:#071b20;font-weight:800
}
#viewerFrame{width:100%;flex:1;border:0;background:white}
#loading{
  position:absolute;inset:54px 0 0;display:flex;
  align-items:center;justify-content:center;text-align:center;
  padding:25px;color:#8da1b8;font-size:14px;line-height:2
}
#error{display:none;color:#ff9b9b}
</style>
</head>

<body>

<header class="viewer-header">
  <div class="viewer-title">SynapseMed · المحاكاة</div>
  <button class="viewer-home" id="homeButton" type="button">الرئيسية</button>
</header>

<div id="loading">جارٍ تحميل المحاكاة...</div>
<div id="error"></div>

<iframe id="viewerFrame" title="المحاكاة التعليمية"></iframe>

<script>
"use strict";

const frame=document.getElementById("viewerFrame");
const loading=document.getElementById("loading");
const errorBox=document.getElementById("error");

function goHome(){
  window.location.replace(new URL("index.html",document.baseURI).href);
}

document.getElementById("homeButton").addEventListener("click",goHome);

function showError(message){
  loading.style.display="none";
  errorBox.style.display="block";
  errorBox.textContent=message;
}

async function loadSimulation(){
  const params=new URLSearchParams(window.location.search);
  const fileUrl=params.get("url");

  if(!fileUrl){
    showError("رابط المحاكاة غير موجود.");
    return;
  }

  let parsedUrl;

  try{
    parsedUrl=new URL(fileUrl);
  }catch(error){
    showError("رابط المحاكاة غير صالح.");
    return;
  }

  if(parsedUrl.protocol!=="https:" ||
     parsedUrl.hostname!=="kzqzbogrjhbxievvdmvr.supabase.co"){
    showError("مصدر المحاكاة غير مسموح.");
    return;
  }

  try{
    const response=await fetch(parsedUrl.href,{
      method:"GET",
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    let html=await response.text();

    if(!html.trim()){
      throw new Error("الملف فارغ.");
    }

    if(!/<html[\s>]/i.test(html) && !/<!doctype/i.test(html)){
      throw new Error("الملف المستلم ليس صفحة HTML صالحة.");
    }

    const baseTag='<base href="'+
      parsedUrl.href.replace(/"/g,"%22")+
      '">';

    if(/<head[^>]*>/i.test(html)){
      html=html.replace(/<head([^>]*)>/i,"<head$1>"+baseTag);
    }else{
      html=baseTag+html;
    }

    const blob=new Blob([html],{type:"text/html;charset=utf-8"});
    const blobUrl=URL.createObjectURL(blob);

    frame.onload=()=>{
      loading.style.display="none";
    };

    frame.src=blobUrl;

  }catch(error){
    console.error("Simulation loading failed:",error);
    showError(
      "تعذر تحميل المحاكاة. تحقق من اتصال الإنترنت وإمكانية الوصول إلى الملف."
    );
  }
}

loadSimulation();
</script>

</body>
</html>
